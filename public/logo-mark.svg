<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="256" height="256">
  <!-- LogicLoom Web icon on a transparent ground, for use anywhere the
       brand mark is needed outside the app. The 8-unit margin built into
       the viewBox is the mandated clear space (one band width). -->
  <defs>
    <linearGradient id="logicloom-band-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2D2B6B"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>

  <g fill="url(#logicloom-band-gradient)">
    <rect x="8" y="32" width="48" height="8" rx="1"/>
    <rect x="8" y="44" width="48" height="8" rx="1"/>
    <rect x="12" y="8" width="8" height="48" rx="1"/>
    <rect x="24" y="8" width="8" height="48" rx="1"/>
    <rect x="12" y="44" width="8" height="8"/>
    <rect x="24" y="32" width="8" height="8"/>
  </g>

  <g fill="#FFFFFF">
    <circle cx="16" cy="36" r="2.6"/>
    <circle cx="16" cy="48" r="2.6"/>
    <circle cx="28" cy="36" r="2.6"/>
    <circle cx="28" cy="48" r="2.6"/>
  </g>
</svg>
