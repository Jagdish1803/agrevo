<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- LogicLoom Web favicon — the icon alone, which stays legible at 32px.
       Geometry mirrors components/ui/LogoMark.tsx exactly. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2D2B6B"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="#FFFFFF"/>

  <g fill="url(#g)">
    <!-- Horizontal bands (the foot) -->
    <rect x="8" y="32" width="48" height="8" rx="1"/>
    <rect x="8" y="44" width="48" height="8" rx="1"/>
    <!-- Vertical bands (the stem), laid over the horizontals -->
    <rect x="12" y="8" width="8" height="48" rx="1"/>
    <rect x="24" y="8" width="8" height="48" rx="1"/>
    <!-- Crossings where the horizontal weaves back on top -->
    <rect x="12" y="44" width="8" height="8"/>
    <rect x="24" y="32" width="8" height="8"/>
  </g>

  <!-- A node at each crossing point -->
  <g fill="#FFFFFF">
    <circle cx="16" cy="36" r="2.6"/>
    <circle cx="16" cy="48" r="2.6"/>
    <circle cx="28" cy="36" r="2.6"/>
    <circle cx="28" cy="48" r="2.6"/>
  </g>
</svg>
